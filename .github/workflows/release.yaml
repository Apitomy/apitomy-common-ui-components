name: Release
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    outputs:
      release-version: ${{ steps.versions.outputs.release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"


      - name: Compute Release Version
        id: versions
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "release-version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $CURRENT_VERSION"


      - name: Build Project
        run: |
          npm ci
          npm run lint
          npm run build


      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.versions.outputs.release-version }}" \
            --title "${{ steps.versions.outputs.release-version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}


  finalize:
    needs: release
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git pull


      - name: Bump to next patch version
        run: |
          npm version patch --no-git-tag-version
          NEXT_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "Automated version update: $NEXT_VERSION"
          git push


  # Slack: the outcome of the release. Success to the general channel, a failure
  # to the important one, mentioning whoever ran it. npm publishing is triggered
  # separately by the GitHub release event and reports its own result.
  notify:
    name: Notify
    needs: [release, finalize]
    if: ${{ !cancelled() && github.repository_owner == 'Apitomy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'important' || 'general' }}
          text: "${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && format(':x: {0}: release {1} failed (release {2}, finalize {3})', github.repository, needs.release.outputs.release-version, needs.release.result, needs.finalize.result) || format(':rocket: {0} {1} released', github.repository, needs.release.outputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
